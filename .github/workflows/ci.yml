name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t acme-webapp:${{ github.sha }} .

      - name: Run container and test
        run: |
          docker run -d -p 5000:5000 --name test-app acme-webapp:${{ github.sha }}
          for attempt in {1..10}; do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs test-app
          exit 1
