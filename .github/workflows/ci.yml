name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buidx-action@v2

      - name: Build Docker image
        run: docker build -t acme-webapp:${{ github.sha }} .

      - name: Run container and test
        run: |
          docker run -d -p 5000:5000 --name test-app acme-webapp:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/health
