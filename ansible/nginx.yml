---
- name: Install and configure Nginx
  hosts: webservers
  become: yes
  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Create custom index.html
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>Acme Corp</title></head>
          <body>
            <h1>Welcome to Acme Corp</h1>
            <p>Deployed by Ansible</p>
          </body>
          </html>
        dest: /var/www/html/index.html
